name: Architecture Guard

# Hexagonal Architecture (docs/ARCHITECTURE.md) の依存方向を機械的にガードする。
# Domain 層 (ImasLiveDB/Domain/) は SwiftUI/GRDB/CloudKit を import してはいけない。
# 文言も文字列に解決しない (LocalizedStringKey / String(localized: / NSLocalizedString を使わない)。
# ImasLiveDB/Shared/ (アプリとウィジェット拡張の両方がコンパイルする) は Foundation と os だけを import する。
# 違反があれば tools/check_domain_purity.sh が exit 1 になり、このジョブを落とす。
on:
  push:
    branches: [main, develop]
    paths:
      - 'ImasLiveDB/Domain/**'
      - 'ImasLiveDB/Shared/**'
      - 'tools/check_domain_purity.sh'
  pull_request:
    paths:
      - 'ImasLiveDB/Domain/**'
      - 'ImasLiveDB/Shared/**'
      - 'tools/check_domain_purity.sh'
  workflow_dispatch:

jobs:
  domain-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Domain / Shared purity (imports and l10n APIs)
        run: |
          chmod +x tools/check_domain_purity.sh
          ./tools/check_domain_purity.sh
